name: monitoring

services:
  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - mgmt_net
    volumes:
      - loki_data:/loki
    labels:
      monitoring: "loki"
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3333:3000"
    networks:
      - mgmt_net
    depends_on:
      - loki
    labels:
      monitoring: "loki"

  alloy:
    image: grafana/alloy:latest
    privileged: false
    ports:
      - "12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/tmp/alloy
      - /etc/alloy/config.alloy
    networks:
      - mgmt_net
    depends_on:
      - loki
    labels:
      monitoring: "loki"

volumes:
  loki_data:

networks:
  mgmt_net:
    external: true
    name: fog_mgmt_net
