name: fog
services:
  camera-a:
    image: camera:latest
    build:
      context: ./fog_devices
      dockerfile: ./camera/Dockerfile
    labels:
      monitoring: "loki"
    environment:
      - FOG=http://fog-a:8000
      - CAMERA_ID=camera1
      - ATTACK_MODE=${ATTACK_MODE:-true}
    networks:
      - zone_a_net
  camera-b:
    image: camera:latest
    build:
      context: ./fog_devices
      dockerfile: ./camera/Dockerfile
    labels:
      monitoring: "loki"
    environment:
      - FOG=http://fog-b:8000
      - CAMERA_ID=camera2
    networks:
      zone_b_net:
        ipv4_address: 10.10.2.10
  fog-a:
    image: fog:latest
    build:
      context: ./fog_devices
      dockerfile: ./fog/Dockerfile
    labels:
      monitoring: "loki"
    environment:
      - CLOUD=http://cloud:8000
      - EDGE_ID=fog1
    cap_add:
      - NET_ADMIN
    networks:
      zone_a_net:
        ipv4_address: 10.10.1.12
        interface_name: eth1
      backbone_net:
        ipv4_address: 10.10.3.11
        interface_name: eth0
      mgmt_net:
        ipv4_address: 10.10.4.11
        interface_name: eth2
    cpus: 0.5
    mem_limit: 256M
  fog-b:
    image: fog:latest
    build:
      context: ./fog_devices
      dockerfile: ./fog/Dockerfile
    labels:
      monitoring: "loki"
    environment:
      - CLOUD=http://cloud:8000
      - EDGE_ID=fog2
    cap_add:
      - NET_ADMIN
    networks:
      zone_b_net:
        ipv4_address: 10.10.2.12
        interface_name: eth1
      backbone_net:
        ipv4_address: 10.10.3.12
        interface_name: eth0
      mgmt_net:
        ipv4_address: 10.10.4.12
        interface_name: eth2
    cpus: 0.5
    mem_limit: 256M
  cloud:
    image: cloud:latest
    build:
      context: ./fog_devices
      dockerfile: ./cloud/Dockerfile
    labels:
      monitoring: "loki"
    cpus: 0.5
    mem_limit: 512M
    networks:
      backbone_net:
        ipv4_address: 10.10.3.13
      mgmt_net:
        ipv4_address: 10.10.4.13
volumes:
  loki_data:

networks:
  zone_a_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
  zone_b_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.2.0/24
  backbone_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.3.0/24
  mgmt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.4.0/24
